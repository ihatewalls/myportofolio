    {% extends 'base.html' %}
    {% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/melayang.jpg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Last Login Session</dt>
                            <dd>{{ last_login }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/ihatewalls" target="_blank" rel="noopener noreferrer" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/musthofa-ridho/" target="_blank" rel="noopener noreferrer" class="social-link">LinkedIn</a>
                        <a href="musthofa.ridho@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
